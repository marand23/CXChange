name: Deploy Next.js App to IIS
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build
      - name: Deploy to Windows Server
        run: |
          scp -i ${{ secrets.SSH_PRIVATE_KEY }} -r .next/ static/ user@${{ secrets.HOST }}:/path/to/your/app
          ssh -i ${{ secrets.SSH_PRIVATE_KEY }} user@${{ secrets.HOST }} 'iisreset /restart'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
